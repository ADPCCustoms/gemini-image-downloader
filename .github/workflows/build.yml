name: Build Windows exe

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    tags:
      - "v*"                # pushing a tag like v1.0.0 builds and publishes a release

permissions:
  contents: write           # needed to attach the exe to a GitHub release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip playwright customtkinter pyinstaller

      - name: Build exe
        run: python -m PyInstaller --clean --onefile --windowed --collect-all playwright --collect-all customtkinter --add-data "icon.ico;." --icon icon.ico --name GeminiImageDownloader gemini_image_downloader.py

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\GeminiImageDownloader.exe -Algorithm SHA256).Hash
          "$hash  GeminiImageDownloader.exe" | Out-File -Encoding ascii dist\GeminiImageDownloader.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiImageDownloader
          path: |
            dist/GeminiImageDownloader.exe
            dist/GeminiImageDownloader.exe.sha256

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GeminiImageDownloader.exe
            dist/GeminiImageDownloader.exe.sha256
          generate_release_notes: true
